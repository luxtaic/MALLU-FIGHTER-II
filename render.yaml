services:
  - type: web
    name: mallu-fighter-ii
    runtime: node
    plan: free
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TTS_PROVIDER
        value: azure
      - key: AZURE_SPEECH_REGION
        value: centralindia
